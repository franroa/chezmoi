# clean up stale bindings from old config
unbind C
unbind O

# reload config
unbind r
bind R source-file ~/.tmux.conf

# resurrect save/restore
bind s run-shell /home/froa/.config/tmux/plugins/tmux-resurrect/scripts/save.sh
bind r confirm-before -p "resurrect RESTORE — overwrites current session from last save. Continue? (y/n)" "run-shell /home/froa/.config/tmux/plugins/tmux-resurrect/scripts/restore.sh"

# aoen new session (moved from s → a)
bind a popup -d '#{pane_current_path}' -w 80% -h 80% -E -e 'TMUX_PARENT_CLIENT=#{client_tty}' '/home/froa/.config/tmux/scripts/aoen-session.sh'

# aoe new session in ANY folder under $HOME — no ticket/branch prompts, just pick
# a folder then pick which Agent of Empires profile the session belongs to
bind T popup -d '#{pane_current_path}' -w 80% -h 80% -E -e 'TMUX_PARENT_CLIENT=#{client_tty}' '/home/froa/.config/tmux/scripts/aoe-profile-session.sh'

bind S popup -d '#{pane_current_path}' -w 50% -h 40% -E '/home/froa/.config/tmux/scripts/session-picker.sh'
bind G switch-client -T gitlab
bind A switch-client -T parallel

# jump to a session by its status-bar letter (a/b/c…): prefix ' then one letter,
