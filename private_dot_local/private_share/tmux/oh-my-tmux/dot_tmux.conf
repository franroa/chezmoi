# cycle status-bar labels (letters → names → both), fires instantly
bind '"' run-shell '~/.config/tmux/scripts/session-toggle.sh'
# prev/next session follow the status-bar letter order (creation time), not name
bind -r ( run-shell '~/.config/tmux/scripts/session-cycle.sh prev'
bind -r ) run-shell '~/.config/tmux/scripts/session-cycle.sh next'

