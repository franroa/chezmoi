# popup scratch terminal (point 1)
bind g popup -d '#{pane_current_path}' -w 80% -h 80% -E

# sessionizer: fzf project dirs → create/switch session (point 2)
bind C-f popup -d '#{pane_current_path}' -w 60% -h 50% -E '/home/froa/.config/tmux/scripts/sessionizer.sh'

# snapshot picker: fzf restore/delete named snapshots
bind C-n popup -d '#{pane_current_path}' -w 50% -h 40% -E '/home/froa/.config/tmux/scripts/snapshot-picker.sh'

# click a session name in the status line → focus that session.
# tmux-session-list wraps each block in #[range=user|N]; clicking sets
# mouse_status_range to N, which session-menu.sh maps back to a session.
bind -T root MouseDown1Status if-shell -F '#{mouse_status_range}' \
  "run-shell '/home/froa/.config/tmux/scripts/session-menu.sh \"#{mouse_status_range}\"'"
# right-click a session name → CLOSE it (kill tmux session; leave AOE record).
bind -T root MouseDown3Status if-shell -F '#{mouse_status_range}' \
  "run-shell '/home/froa/.config/tmux/scripts/session-menu.sh \"#{mouse_status_range}\" kill'"
# ctrl-right-click a session name → CLOSE + `aoe remove` (across all profiles).
bind -T root C-MouseDown3Status if-shell -F '#{mouse_status_range}' \
  "run-shell '/home/froa/.config/tmux/scripts/session-menu.sh \"#{mouse_status_range}\" remove'"

# skip jot's hidden popup sessions (__tmux__jot_*) so they stay single-pane and close on editor exit.
# Also skip while resurrect is restoring (@restore_in_progress set by the resurrect hooks below):
#   - the old `run-shell save.sh` here clobbered the good multi-session save with an empty `default`
#     when it raced continuum-restore at boot, which is why sessions "sometimes" didn't come back;
#   - and the split would otherwise add a spurious pane to every restored session.
set-hook -g after-new-session 'if-shell -F "#{||:#{m:__tmux__jot_*,#{session_name}},#{@restore_in_progress}}" "" "split-window -h -c \"#{pane_current_path}\" -d ; resize-pane -Z"'
# guard flag: raised around resurrect restore so the hook above stays quiet during it
set -g @resurrect-hook-pre-restore-all 'tmux set-option -g @restore_in_progress 1'
set -g @resurrect-hook-post-restore-all 'tmux set-option -gu @restore_in_progress'
