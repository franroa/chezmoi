run '~/.tmux/plugins/tpm/tpm'

# harpoon list (C-h freed for vim-tmux-navigator; use M-h instead)
bind-key -n "M-h" run-shell "~/.config/tmux/plugins/tmux-harpoon/harpoon -l"

# keybindings cheatsheet
bind-key h display-popup -E -w 90% -h 90% "less -R ~/tmux-keymaps.md"

# ── GitLab direct bindings ────────────────────────────────────────────────────
# Placed AFTER run tpm so plugins (tmux-logging, TPM itself) cannot overwrite.
#   O  open repo in browser
#   P  open latest pipeline in browser
#   C  interactive pipeline TUI (glab ci view)
#   (pipelines-list 'I' removed — prefix-I is TPM install; use prefix G → I)
bind-key O run-shell "~/.config/tmux/scripts/glab-open.sh repo '#{pane_current_path}'"
bind-key P run-shell "~/.config/tmux/scripts/glab-open.sh pipeline '#{pane_current_path}'"
bind-key C popup -E -w 95% -h 90% -d "#{pane_current_path}" "bash ~/.config/tmux/scripts/gctui-popup.sh --remote '#{pane_current_path}'"

# ── GitLab pipeline mouse bindings ───────────────────────────────────────────
# Middle-click       → open that repo's latest pipeline in the browser.
# Ctrl+middle-click  → open the gctui pipeline TUI popup.
# In a mouse binding tmux expands #{pane_current_path} against the element UNDER
# the cursor (verified: a status-line click resolves to that window's pane, not
# the active one), so passing it directly hits the pane you clicked — including
# inactive panes, and including a session/window name on the status line (which
# opens THAT session's pipeline). Button 2 has no default pane binding, so this
# shadows nothing. Do NOT route the path through `tmux display -p`: that runs in
# a fresh context and collapses back to the active pane.
bind -T root MouseDown2Pane     run-shell "~/.config/tmux/scripts/glab-open.sh pipeline '#{pane_current_path}'"
bind -T root MouseDown2Status   run-shell "~/.config/tmux/scripts/glab-open.sh pipeline '#{pane_current_path}'"
bind -T root C-MouseDown2Pane   popup -E -w 95% -h 90% -d "#{pane_current_path}" "bash ~/.config/tmux/scripts/gctui-popup.sh '#{pane_current_path}'"
bind -T root C-MouseDown2Status popup -E -w 95% -h 90% -d "#{pane_current_path}" "bash ~/.config/tmux/scripts/gctui-popup.sh '#{pane_current_path}'"

# ── Context-files popup mouse binding ────────────────────────────────────────
# Alt+left-click → the same breakdown as prefix-K i (the 📄 statusline badge:
# source/total + 🧠 memory files). A true hover tooltip is impossible (tmux has
# no hover event, and the badge is Claude-pane content), so this is the click
# affordance for it. Alt+button-1 is free (plain button-1 keeps select/copy;
# middle-click and Ctrl+middle are the GitLab bindings above). The script finds
# the Claude pane itself, so the click can land in any pane.
bind -T root M-MouseDown1Pane   run-shell -b "~/tmux-context-inspector/scripts/show_context_files.sh"
bind -T root M-MouseDown1Status run-shell -b "~/tmux-context-inspector/scripts/show_context_files.sh"

# ── Context inspector navigator (prefix-K) ───────────────────────────────────
# Source the plugin so the prefix-K key-table is (re)created: single views plus
# the agentsview fzf navigators (sub-tables — s Sessions → n by name, c content,
# etc.). This MUST run here (after `run tpm`) on every reload/restart; otherwise
# a fresh tmux server never builds the context-inspector / ci-sessions tables and
# prefix-K (and K s n) silently do nothing.
run-shell "~/tmux-context-inspector/context-inspector.tmux"

# ── GitLab leader table (prefix-G → key) ─────────────────────────────────────
# Mirrors the direct bindings above plus MR/CI terminal commands.
bind -T gitlab O run-shell "~/.config/tmux/scripts/glab-open.sh repo '#{pane_current_path}'"
bind -T gitlab P run-shell "~/.config/tmux/scripts/glab-open.sh pipeline '#{pane_current_path}'"
bind -T gitlab I run-shell "~/.config/tmux/scripts/glab-open.sh pipelines-list '#{pane_current_path}'"
bind -T gitlab C popup -E -w 95% -h 90% -d "#{pane_current_path}" "bash ~/.config/tmux/scripts/gctui-popup.sh --remote '#{pane_current_path}'"
# S  gctui Remote view (same as C): stage board + child pipelines, logs, retry…
bind -T gitlab S popup -E -w 95% -h 90% -d "#{pane_current_path}" "bash ~/.config/tmux/scripts/gctui-popup.sh --remote '#{pane_current_path}'"
# ?  gctui usage / flags
bind -T gitlab ? popup -E -w 70% -h 55% -d "#{pane_current_path}" "bash -c '~/.local/bin/gctui --help 2>&1; read -p \"Press enter to close\" _'"
bind -T gitlab L popup -E -w 80% -h 50% -d "#{pane_current_path}" "bash -c 'glab mr list 2>&1; echo; read -p \"Press enter to close\" _'"
bind -T gitlab R popup -E -w 95% -h 90% -d "#{pane_current_path}" "bash -c '~/.config/tmux/scripts/glab-mr-review.sh \"#{pane_current_path}\" || read -p \"Press enter to close\" _'"
bind -T gitlab M popup -E -w 80% -h 80% -d "#{pane_current_path}" 'glab mr create'
bind -T gitlab V run-shell "glab mr view --web"
# u  setup: init submodules + verify gcl variables (run before first local pipeline)
bind -T gitlab u popup -E -w 90% -h 75% -d "#{pane_current_path}" "bash ~/.config/tmux/scripts/gcl-setup.sh '#{pane_current_path}'"
# d  local CI view (same as v)
bind -T gitlab d popup -E -w 95% -h 90% -d "#{pane_current_path}" "bash ~/.config/tmux/scripts/gctui-popup.sh '#{pane_current_path}'"

# ── gctui — unified local + remote pipeline TUI ──────────────────────────────
# One binary with Local + Remote tabs (Tab switches in-app); run/cancel/retry/
# logs/filter/disable all live inside it. Replaces the old per-action dispatcher.
#   v open (local) · C/S open (remote) · y config view · j assemble (headless)
bind -T gitlab v popup -E -w 95% -h 90% -d "#{pane_current_path}" "bash ~/.config/tmux/scripts/gctui-popup.sh '#{pane_current_path}'"
bind -T gitlab y popup -E -w 95% -h 90% -d "#{pane_current_path}" "bash ~/.config/tmux/scripts/gctui-popup.sh --config '#{pane_current_path}'"
# m  merge-requests view (gctui --mrs)
bind -T gitlab m popup -E -w 95% -h 90% -d "#{pane_current_path}" "bash ~/.config/tmux/scripts/gctui-popup.sh --mrs '#{pane_current_path}'"
# j  assemble a modular component-based pipeline (headless; gctui assemble)
bind -T gitlab j popup -E -w 90% -h 70% -d "#{pane_current_path}" "bash -c '~/.local/bin/gctui assemble \"#{pane_current_path}\"; read -p \"Press enter to close\" _'"

# ── Parallel agents leader table (prefix-A → key) ────────────────────────────
# Modes for parallel Claude/agent work. See ~/.config/tmux/scripts/{swarm,
# orchestrate,pipeline-baton}.sh and ~/.config/tmuxinator/{swarm,review,
# pipeline,monitor,workflow}.yml
# O  AOE scratchpad — popup dialog: pick profile + name, ensures an AOE scratch
#    session "SP-<name>" exists/running, then switches this client into it. The
#    session keeps running after detach. See guides/scratch-sessions.
bind -T parallel O popup -E -w 85% -h 85% -e 'TMUX_PARENT_CLIENT=#{client_tty}' "~/.config/tmux/scripts/aoe-scratchpad.sh"
# l  list every Claude/AOE session across ALL repos; enter one to switch into it
bind -T parallel l popup -E -w 90% -h 80% -d "#{pane_current_path}" -e 'TMUX_PARENT_CLIENT=#{client_tty}' "bash -c '~/.config/tmux/scripts/aoe-claude-sessions.sh'"
# s  spawn a ticket swarm (prompts for comma-separated names)
bind -T parallel s popup -E -w 80% -h 60% -d "#{pane_current_path}" "bash -c '~/.config/tmux/scripts/swarm.sh interactive'"
# S  open the persistent swarm control session (dashboard + shell)
bind -T parallel S run-shell "tmuxinator start swarm root='#{pane_current_path}'"
# d  live dashboard of all worker sessions (popup)
bind -T parallel d popup -E -w 90% -h 60% -d "#{pane_current_path}" "bash -c '~/.config/tmux/scripts/swarm-dashboard.sh watch'"
# r  multi-perspective review layout
bind -T parallel r run-shell "tmuxinator start review root='#{pane_current_path}' id=rev"
# p  staged pipeline layout (plan→implement→test→review)
bind -T parallel p run-shell "tmuxinator start pipeline root='#{pane_current_path}' id=p"
# m  monitor dashboards layout
bind -T parallel m run-shell "tmuxinator start monitor root='#{pane_current_path}'"
# o  dynamic workflow (orchestrator-Claude)
bind -T parallel o run-shell "tmuxinator start workflow root='#{pane_current_path}' id=wf"
# a  autopilot status (cron-scheduled jobs + recent daily-report workers)
bind -T parallel a popup -E -w 80% -h 50% -d "#{pane_current_path}" "bash -c '~/.config/tmux/scripts/autopilot.sh list; echo; read -p \"Press enter to close\" _'"
# P  peek a worker's output without attaching (prompts for id/name, pages it)
bind -T parallel P popup -E -w 90% -h 70% -d "#{pane_current_path}" "bash -c '~/.config/tmux/scripts/swarm.sh peek-i'"
# R  reap only the finished (done) workers — keeps active ones
bind -T parallel R popup -E -w 80% -h 50% -d "#{pane_current_path}" "bash -c '~/.config/tmux/scripts/swarm.sh reap-done; echo; read -p \"Press enter to close\" _'"
# x  tear down the whole swarm (remove worktrees + branches)
bind -T parallel x popup -E -w 80% -h 50% -d "#{pane_current_path}" "bash -c '~/.config/tmux/scripts/swarm.sh teardown; echo; read -p \"Press enter to close\" _'"

# ── Snapshot leader table (prefix-N → key) ───────────────────────────────────
# s save · r restore are bound by tmux-named-snapshot into the 'snapshot' table
# (@named-snapshot-switch-client 'N:snapshot'). p adds the fzf picker here too.
bind -T snapshot p popup -d '#{pane_current_path}' -w 50% -h 40% -E '/home/froa/.config/tmux/scripts/snapshot-picker.sh'
