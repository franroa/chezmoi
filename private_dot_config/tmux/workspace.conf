# Workspace: claude / nvim / git panes + scratch popup. Sourced from the end of
# the oh-my-tmux .tmux.conf so these override the older o/g/G/hook definitions.
#   C-b o  claude   C-b e  nvim   C-b g  git (lazygit)   C-b k  k9s
#   C-b v  shell pane for running commands
#   C-b K  pick the session's kube cluster (colors, k9s, claude, shells follow)
#   C-b I  context-inspector (was K); tpm install moved to C-b M-I
#   C-b G  GitLab leader table (unchanged, defined in the oh-my-tmux file)

bind o run-shell '~/.config/tmux/scripts/workspace-focus.sh claude'
bind e run-shell '~/.config/tmux/scripts/workspace-focus.sh nvim'
bind k run-shell '~/.config/tmux/scripts/workspace-focus.sh k9s'

bind g run-shell '~/.config/tmux/scripts/workspace-focus.sh git'
bind v run-shell '~/.config/tmux/scripts/workspace-focus.sh shell'

bind K display-popup -E -w 50% -h 50% '~/.config/tmux/scripts/kube-pick.sh'
bind I switch-client -T context-inspector
bind M-I run-shell ~/.tmux/plugins/tpm/bindings/install_plugins

# skip jot popup sessions and sessions being restored by resurrect
set-hook -g after-new-session 'if-shell -F "#{||:#{m:__tmux__jot_*,#{session_name}},#{||:#{m:scratch-*,#{session_name}},#{@restore_in_progress}}}" "" "run-shell \"~/.config/tmux/scripts/workspace-init.sh\""'
