# Source hooks after session starts
# This is a workaround for tmux set-hook issues
run-shell "tmux set-hook -u after-new-session 'run-shell \"/home/froa/.config/hypr/UserScripts/tmux-track-pwd.sh new\"'"
run-shell "tmux set-hook -u client-attached 'run-shell \"/home/froa/.config/hypr/UserScripts/tmux-track-pwd.sh attach\"'"
run-shell "tmux set-hook -u client-session-changed 'run-shell \"/home/froa/.config/hypr/UserScripts/tmux-track-pwd.sh switch\"'"

# Force an immediate status-line redraw the instant the active session/window
# changes. status-left is a slow #() job (tmux-session-list) that re-runs only
# every status-interval, so without this the focused-session highlight lags ~1s
# behind the switch. -S = redraw status only.
run-shell "tmux set-hook -ga client-session-changed 'refresh-client -S'"
run-shell "tmux set-hook -ga session-window-changed 'refresh-client -S'"