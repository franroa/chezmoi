# yaml-language-server: $schema=config.schema.yaml
command_alias_start_index: 200
keybindings:
  root_table: ""
  prefix_table: Space
title:
  style: align=centre,bold
  prefix: tmux
  prefix_style: fg=green,align=centre,bold
position:
  x: R
  y: P
custom_variables:
  - name: log_info
    value: "#[fg=green,italics] [info]#[default]#[italics]"
macros:
  - name: reload-config
    commands:
      - display "#{log_info} Loading config... "
      - source-file $HOME/.tmux.conf
      - display -p "\n\n... Press ENTER to continue"
  - name: restart-pane
    commands:
      - display "#{log_info} Restarting pane"
      - "respawnp -k -c #{pane_current_path}"
items:
  - name: Run
    key: space
    command: command-prompt
  - name: Last window
    key: tab
    command: last-window
  - name: Last pane
    key: "`"
    command: last-pane
  - name: Copy
    key: c
    menu:
      - name: Copy
        key: c
        command: copy-mode
      - name: List buffers
        key: "#"
        command: list-buffers
  - separator: true
  - name: +Windows
    key: w
    menu:
      - name: Last
        key: tab
        command: last-window
      - name: Choose
        key: w
        command: choose-tree -Zw
      - name: Previous
        key: p
        command: previous-window
      - name: Next
        key: n
        command: next-window
      - name: New
        key: c
        command: "neww -c #{pane_current_path}"
      - separator: true
      - name: +Layout
        key: l
        menu:
          - name: Next
            key: l
            command: nextl
            transient: true
          - name: Tiled
            key: t
            command: selectnl tiled
          - name: Horizontal
            key: h
            command: selectl even-horizontal
          - name: Vertical
            key: v
            command: selectl even-vertical
          - name: Horizontal main
            key: H
            command: selectl main-horizontal
          - name: Vertical main
            key: V
            command: selectl main-vertical
      - name: Split horizontal
        key: /
        command: "splitw -h -c #{pane_current_path}"
      - name: Split vertical
        key: "-"
        command: "splitw -v -c #{pane_current_path}"
      - name: Rotate
        key: o
        command: rotatew
        transient: true
      - name: Rotate reverse
        key: O
        command: rotatew -D
        transient: true
      - separator: true
      - name: Rename
        key: R
        command: command-prompt -I "#W" "renamew -- \"%%\""
      - name: Kill
        key: X
        command: 'confirm -p "Kill window #W? (y/n)" killw'
      - separator: true
      - name: +Worktrees
        key: W
        menu:
          - name: Choose
            key: w
            command: run-shell -b "~/.config/tmux/plugins/tmux-worktrees/scripts/worktree-manager.sh choose"
          - name: Cleanup
            key: d
            command: run-shell -b "~/.config/tmux/plugins/tmux-worktrees/scripts/worktree-manager.sh cleanup"
  - name: +Panes
    key: p
    menu:
      - name: Last
        key: tab
        command: lastp
      - name: Choose
        key: p
        command: displayp -d 0
      - separator: true
      - name: Left
        key: h
        command: selectp -L
      - name: Down
        key: j
        command: selectp -D
      - name: Up
        key: k
        command: selectp -U
      - name: Right
        key: l
        command: selectp -R
      - separator: true
      - name: Zoom
        key: z
        command: resizep -Z
      - name: +Resize
        key: r
        menu:
          - name: Left
            key: h
            command: resizep -L
            transient: true
          - name: Down
            key: j
            command: resizep -D
            transient: true
          - name: Up
            key: k
            command: resizep -U
            transient: true
          - name: Right
            key: l
            command: resizep -R
            transient: true
          - name: Left more
            key: H
            command: resizep -L 10
            transient: true
          - name: Down more
            key: J
            command: resizep -D 10
            transient: true
          - name: Up more
            key: K
            command: resizep -U 10
            transient: true
          - name: Right more
            key: L
            command: resizep -R 10
            transient: true
      - name: Swap left
        key: H
        command: swapp -t "{left-of}"
      - name: Swap down
        key: J
        command: swapp -t "{down-of}"
      - name: Swap up
        key: K
        command: swapp -t "{up-of}"
      - name: Swap right
        key: L
        command: swapp -t "{right-of}"
      - name: Break
        key: "!"
        command: break-pane
      - separator: true
      - name: Mark
        key: m
        command: selectp -m
      - name: Unmark
        key: M
        command: selectp -M
      - name: Capture
        key: C
        command: capture-pane
      - name: Respawn pane
        key: R
        macro: restart-pane
      - name: Kill
        key: X
        command: 'confirm -p "Kill pane #P? (y/n)" killp'
  - name: +Buffers
    key: b
    menu:
      - name: Choose
        key: b
        command: choose-buffer -Z
      - name: List
        key: l
        command: lsb
      - name: Paste
        key: p
        command: pasteb
  - name: +Sessions
    key: s
    menu:
      - name: Choose
        key: s
        command: choose-tree -Zs
      - name: New
        key: N
        command: new
      - name: Rename
        key: r
        command: rename
      - separator: true
      - name: New AOE session
        key: a
        command: "display-popup -E -d \"#{pane_current_path}\" -w 80% -h 80% -e TMUX_PARENT_CLIENT=#{client_tty} ~/.config/tmux/scripts/aoen-session.sh"
      - name: New AOE session (any folder, pick profile)
        key: A
        command: "display-popup -E -d \"#{pane_current_path}\" -w 80% -h 80% -e TMUX_PARENT_CLIENT=#{client_tty} ~/.config/tmux/scripts/aoe-profile-session.sh"
      - name: Session picker
        key: p
        command: "display-popup -E -d \"#{pane_current_path}\" -w 50% -h 40% ~/.config/tmux/scripts/session-picker.sh"
      - name: Sessionizer (projects)
        key: f
        command: "display-popup -E -d \"#{pane_current_path}\" -w 60% -h 50% ~/.config/tmux/scripts/sessionizer.sh"
      - name: Session wizard
        key: w
        command: "display-popup -E -h 40% -w 80% ~/.config/tmux/plugins/tmux-session-wizard/bin/t"
      - name: SSH to host (ft)
        key: t
        command: "display-popup -E -d \"#{pane_current_path}\" -w 80% -h 80% ~/.local/bin/ft.sh"
      - separator: true
      - name: +Resurrect
        key: R
        menu:
          - name: Save session
            key: s
            command: run-shell ~/.config/tmux/plugins/tmux-resurrect/scripts/save.sh
          - name: Restore session
            key: r
            command: run-shell ~/.config/tmux/plugins/tmux-resurrect/scripts/restore.sh
      - name: +Snapshots
        key: S
        menu:
          - name: Save named
            key: s
            command: "command-prompt -p \"Snapshot name:\" \"run-shell ~/.config/tmux/plugins/tmux-named-snapshot/scripts/save-snapshot.sh %%\""
          - name: Restore named
            key: r
            command: "command-prompt -p \"Snapshot name:\" \"run-shell ~/.config/tmux/plugins/tmux-named-snapshot/scripts/restore-snapshot.sh %%\""
          - name: Pick snapshot
            key: p
            command: "display-popup -E -d \"#{pane_current_path}\" -h 40% -w 50% ~/.config/tmux/scripts/snapshot-picker.sh"
  - name: +Client
    key: C
    menu:
      - name: Choose
        key: c
        command: choose-client -Z
      - name: Last
        key: l
        command: switchc -l
      - name: Previous
        key: p
        command: switchc -p
      - name: Next
        key: n
        command: switchc -n
      - separator: true
      - name: Refresh
        key: R
        command: refresh
      - name: +Plugins
        key: P
        menu:
          - name: Install
            key: i
            command:
              run-shell $TMUX_PLUGIN_MANAGER_PATH/tpm/bindings/install_plugins
          - name: Update
            key: u
            command:
              run-shell $TMUX_PLUGIN_MANAGER_PATH/tpm/bindings/update_plugins
          - name: Clean
            key: c
            command:
              run-shell $TMUX_PLUGIN_MANAGER_PATH/tpm/bindings/clean_plugins
      - name: Detach
        key: D
        command: detach
      - name: Suspend
        key: Z
        command: suspendc
      - separator: true
      - name: Reload config
        key: r
        macro: reload-config
      - name: Customize
        key: ","
        command: customize-mode -Z
  - separator: true
  - name: +Harpoon
    key: h
    menu:
      - name: List
        key: l
        command: run-shell "~/.config/tmux/plugins/tmux-harpoon/harpoon -l"
      - name: Add window
        key: a
        command: run-shell "~/.config/tmux/plugins/tmux-harpoon/harpoon -a"
      - separator: true
      - name: Slot 1
        key: "1"
        command: run-shell "~/.config/tmux/plugins/tmux-harpoon/harpoon -s 1"
      - name: Slot 2
        key: "2"
        command: run-shell "~/.config/tmux/plugins/tmux-harpoon/harpoon -s 2"
      - name: Slot 3
        key: "3"
        command: run-shell "~/.config/tmux/plugins/tmux-harpoon/harpoon -s 3"
      - separator: true
      - name: Pin to slot 1
        key: H
        command: run-shell "~/.config/tmux/plugins/tmux-harpoon/harpoon -r 1"
  - name: +GitLab
    key: g
    menu:
      - name: Open repo
        key: O
        command: "run-shell \"~/.config/tmux/scripts/glab-open.sh repo #{pane_current_path}\""
      - name: Latest pipeline
        key: P
        command: "run-shell \"~/.config/tmux/scripts/glab-open.sh pipeline #{pane_current_path}\""
      - name: Pipelines list
        key: I
        command: "run-shell \"~/.config/tmux/scripts/glab-open.sh pipelines-list #{pane_current_path}\""
      - name: Pipeline TUI
        key: C
        command: "display-popup -E -d \"#{pane_current_path}\" -h 85% -w 85% \"fish -c \\\"glab ci view\\\"\""
      - separator: true
      - name: CI status
        key: S
        command: "display-popup -E -d \"#{pane_current_path}\" -h 50% -w 80% \"glab ci status 2>&1; echo; read _\""
      - name: MR list
        key: L
        command: "display-popup -E -d \"#{pane_current_path}\" -h 50% -w 80% \"glab mr list 2>&1; echo; read _\""
      - name: Review MR (tuicr)
        key: R
        command: "display-popup -E -d \"#{pane_current_path}\" -h 90% -w 95% \"~/.config/tmux/scripts/glab-mr-review.sh || read _\""
      - name: Create MR
        key: M
        command: "display-popup -E -d \"#{pane_current_path}\" -h 80% -w 80% \"glab mr create\""
      - name: View MR
        key: V
        command: "run-shell \"glab mr view --web\""
      - separator: true
      - name: Local CI setup
        key: u
        command: "display-popup -E -d \"#{pane_current_path}\" -w 90% -h 75% \"bash ~/.config/tmux/scripts/gcl-setup.sh #{pane_current_path}\""
      - name: Pipeline TUI (Local)
        key: v
        command: "new-window -c \"#{pane_current_path}\" -n gctui \"~/.local/bin/gctui #{pane_current_path}\""
      - name: Pipeline TUI (Remote)
        key: d
        command: "new-window -c \"#{pane_current_path}\" -n gctui:remote \"~/.local/bin/gctui --remote #{pane_current_path}\""
      - name: Config view
        key: y
        command: "new-window -c \"#{pane_current_path}\" -n gctui:cfg \"~/.local/bin/gctui --config #{pane_current_path}\""
      - name: Dual view (local + remote)
        key: w
        command: "run-shell \"tmuxinator start ci root=#{pane_current_path}\""
      - name: Assemble pipeline
        key: j
        command: "display-popup -E -d \"#{pane_current_path}\" -w 90% -h 70% \"~/.local/bin/gctui assemble #{pane_current_path}; read _\""
  - name: +Parallel
    key: A
    menu:
      - name: AOE scratchpad
        key: O
        command: "display-popup -E -w 85% -h 85% -e TMUX_PARENT_CLIENT=#{client_tty} ~/.config/tmux/scripts/aoe-scratchpad.sh"
      - name: All Claude sessions (every repo)
        key: l
        command: "display-popup -E -d \"#{pane_current_path}\" -w 90% -h 80% -e TMUX_PARENT_CLIENT=#{client_tty} ~/.config/tmux/scripts/aoe-claude-sessions.sh"
      - separator: true
      - name: Spawn ticket swarm
        key: s
        command: "display-popup -E -d \"#{pane_current_path}\" -w 80% -h 60% \"~/.config/tmux/scripts/swarm.sh interactive\""
      - name: Swarm control session
        key: S
        command: "run-shell \"tmuxinator start swarm root=#{pane_current_path}\""
      - name: Swarm dashboard
        key: d
        command: "display-popup -E -d \"#{pane_current_path}\" -w 90% -h 60% \"~/.config/tmux/scripts/swarm-dashboard.sh watch\""
      - separator: true
      - name: Review layout
        key: r
        command: "run-shell \"tmuxinator start review root=#{pane_current_path} id=rev\""
      - name: Pipeline layout
        key: p
        command: "run-shell \"tmuxinator start pipeline root=#{pane_current_path} id=p\""
      - name: Monitor layout
        key: m
        command: "run-shell \"tmuxinator start monitor root=#{pane_current_path}\""
      - name: Workflow (orchestrator)
        key: o
        command: "run-shell \"tmuxinator start workflow root=#{pane_current_path} id=wf\""
      - separator: true
      - name: Autopilot status
        key: a
        command: "display-popup -E -d \"#{pane_current_path}\" -w 80% -h 50% \"~/.config/tmux/scripts/autopilot.sh list; echo; read _\""
      - name: Peek a worker
        key: P
        command: "display-popup -E -d \"#{pane_current_path}\" -w 90% -h 70% \"~/.config/tmux/scripts/swarm.sh peek-i\""
      - name: Reap done workers
        key: R
        command: "display-popup -E -d \"#{pane_current_path}\" -w 80% -h 50% \"~/.config/tmux/scripts/swarm.sh reap-done; echo; read _\""
      - name: Teardown swarm
        key: x
        command: "display-popup -E -d \"#{pane_current_path}\" -w 80% -h 50% \"~/.config/tmux/scripts/swarm.sh teardown; echo; read _\""
  - name: +Context
    key: K
    menu:
      - name: Context total (transcript, no /context)
        key: c
        command: run-shell -b "/home/froa/tmux-context-inspector/scripts/show_full_context.sh"
      - name: Live /context (sends to REPL)
        key: L
        command: run-shell -b "/home/froa/tmux-context-inspector/scripts/show_live_context.sh"
      - name: System prompt
        key: y
        command: run-shell -b "/home/froa/tmux-context-inspector/scripts/show_system_prompt.sh"
      - name: System tools
        key: t
        command: run-shell -b "/home/froa/tmux-context-inspector/scripts/show_system_tools.sh"
      - name: MCP servers
        key: m
        command: run-shell -b "/home/froa/tmux-context-inspector/scripts/show_mcp.sh"
      - name: Custom agents
        key: a
        command: run-shell -b "/home/froa/tmux-context-inspector/scripts/show_agents.sh"
      - name: Memory / CLAUDE.md
        key: f
        command: run-shell -b "/home/froa/tmux-context-inspector/scripts/show_memory_files.sh"
      - name: Files loaded into context
        key: i
        command: run-shell -b "/home/froa/tmux-context-inspector/scripts/show_context_files.sh"
      - name: Messages
        key: g
        command: run-shell -b "/home/froa/tmux-context-inspector/scripts/show_messages.sh"
      - name: Session health / intel (current)
        key: h
        command: run-shell -b "/home/froa/tmux-context-inspector/scripts/show_health.sh"
      - name: Permissions
        key: p
        command: run-shell -b "/home/froa/tmux-context-inspector/scripts/show_permissions.sh"
      - name: Skills
        key: k
        command: run-shell -b "/home/froa/tmux-context-inspector/scripts/show_skills.sh"
      - name: Cost / usage (session)
        key: o
        command: run-shell -b "/home/froa/tmux-context-inspector/scripts/show_cost.sh"
      - name: Daily usage / cost
        key: u
        command: run-shell -b "/home/froa/tmux-context-inspector/scripts/show_usage.sh"
      - separator: true
      - name: +Sessions (fzf vi)
        key: s
        menu:
          - name: By name
            key: n
            command: "display-popup -E -d \"#{pane_current_path}\" -w 92% -h 88% -e TMUX_PARENT_CLIENT=#{client_tty} /home/froa/tmux-context-inspector/scripts/av_browse.sh sessions name"
          - name: By content (FTS)
            key: c
            command: "display-popup -E -d \"#{pane_current_path}\" -w 92% -h 88% -e TMUX_PARENT_CLIENT=#{client_tty} /home/froa/tmux-context-inspector/scripts/av_browse.sh sessions content"
          - name: By project
            key: p
            command: "display-popup -E -d \"#{pane_current_path}\" -w 92% -h 88% -e TMUX_PARENT_CLIENT=#{client_tty} /home/froa/tmux-context-inspector/scripts/av_browse.sh pick project"
          - name: By agent
            key: a
            command: "display-popup -E -d \"#{pane_current_path}\" -w 92% -h 88% -e TMUX_PARENT_CLIENT=#{client_tty} /home/froa/tmux-context-inspector/scripts/av_browse.sh pick agent"
          - name: By health grade
            key: g
            command: "display-popup -E -d \"#{pane_current_path}\" -w 92% -h 88% -e TMUX_PARENT_CLIENT=#{client_tty} /home/froa/tmux-context-inspector/scripts/av_browse.sh pick grade"
          - name: By outcome
            key: O
            command: "display-popup -E -d \"#{pane_current_path}\" -w 92% -h 88% -e TMUX_PARENT_CLIENT=#{client_tty} /home/froa/tmux-context-inspector/scripts/av_browse.sh pick outcome"
          - name: With tool failures
            key: F
            command: "display-popup -E -d \"#{pane_current_path}\" -w 92% -h 88% -e TMUX_PARENT_CLIENT=#{client_tty} /home/froa/tmux-context-inspector/scripts/av_browse.sh sessions failures"
          - name: All
            key: r
            command: "display-popup -E -d \"#{pane_current_path}\" -w 92% -h 88% -e TMUX_PARENT_CLIENT=#{client_tty} /home/froa/tmux-context-inspector/scripts/av_browse.sh sessions all"
      - name: +Secrets (fzf vi)
        key: S
        menu:
          - name: All findings
            key: l
            command: "display-popup -E -d \"#{pane_current_path}\" -w 92% -h 88% -e TMUX_PARENT_CLIENT=#{client_tty} /home/froa/tmux-context-inspector/scripts/av_browse.sh secrets all"
          - name: By project
            key: p
            command: "display-popup -E -d \"#{pane_current_path}\" -w 92% -h 88% -e TMUX_PARENT_CLIENT=#{client_tty} /home/froa/tmux-context-inspector/scripts/av_browse.sh secrets pick project"
          - name: By agent
            key: a
            command: "display-popup -E -d \"#{pane_current_path}\" -w 92% -h 88% -e TMUX_PARENT_CLIENT=#{client_tty} /home/froa/tmux-context-inspector/scripts/av_browse.sh secrets pick agent"
          - name: Scan now
            key: x
            command: "display-popup -E -d \"#{pane_current_path}\" -w 92% -h 88% -e TMUX_PARENT_CLIENT=#{client_tty} /home/froa/tmux-context-inspector/scripts/av_browse.sh secrets scan"
      - name: Health / intel overview (all)
        key: H
        command: run-shell -b "/home/froa/tmux-context-inspector/scripts/show_health_overview.sh"
      - name: Stats (28d, less)
        key: x
        command: "display-popup -E -d \"#{pane_current_path}\" -w 92% -h 88% -e TMUX_PARENT_CLIENT=#{client_tty} /home/froa/tmux-context-inspector/scripts/av_browse.sh stats"
      - name: Projects browser
        key: r
        command: "display-popup -E -d \"#{pane_current_path}\" -w 92% -h 88% -e TMUX_PARENT_CLIENT=#{client_tty} /home/froa/tmux-context-inspector/scripts/av_browse.sh projects"
      - separator: true
      - name: Web UI — session insights (current)
        key: w
        command: run-shell -b "/home/froa/tmux-context-inspector/scripts/open_web.sh session"
      - name: Web UI — insights dashboard (all)
        key: W
        command: run-shell -b "/home/froa/tmux-context-inspector/scripts/open_web.sh insights"
      - name: Help
        key: "?"
        command: run-shell -b "/home/froa/tmux-context-inspector/scripts/show_help.sh"
  - name: +Tools
    key: t
    menu:
      - name: FZF
        key: f
        command: run-shell -b ~/.config/tmux/plugins/tmux-fzf/main.sh
      - name: Extrakto
        key: e
        command: "run-shell \"\\\"~/.config/tmux/plugins/extrakto/scripts/open.sh\\\" \\\"#{pane_id}\\\"\""
      - name: 1Password
        key: u
        command: "split-window -l 10 ~/.config/tmux/plugins/tmux-1password/scripts/main.sh #{pane_id}"
      - name: Scratch terminal
        key: g
        command: "display-popup -E -d \"#{pane_current_path}\" -w 80% -h 80%"
      - separator: true
      - name: +Jot
        key: j
        menu:
          - name: Open
            key: j
            command: "run-shell \"~/.config/tmux/plugins/tmux-jot/scripts/jot.sh main #{q:client_name} #{q:session_name} > /dev/null 2>&1\""
          - name: Switch
            key: s
            command: "run-shell \"~/.config/tmux/plugins/tmux-jot/scripts/jot.sh switch #{q:client_name} #{q:session_name} > /dev/null 2>&1\""
          - name: Search content
            key: w
            command: "run-shell \"~/.config/tmux/plugins/tmux-jot/scripts/jot.sh content_search #{q:client_name} #{q:session_name} > /dev/null 2>&1\""
          - name: Cleanup
            key: k
            command: "run-shell \"~/.config/tmux/plugins/tmux-jot/scripts/jot.sh cleanup #{q:client_name} #{q:session_name} > /dev/null 2>&1\""
          - name: Doctor
            key: d
            command: "run-shell \"~/.config/tmux/plugins/tmux-jot/scripts/jot.sh doctor #{q:client_name} #{q:session_name} > /dev/null 2>&1\""
      - name: +Logging
        key: l
        menu:
          - name: Toggle logging
            key: t
            command: run-shell ~/.config/tmux/plugins/tmux-logging/scripts/toggle_logging.sh
          - name: Save history
            key: s
            command: run-shell ~/.config/tmux/plugins/tmux-logging/scripts/save_complete_history.sh
          - name: Screen capture
            key: c
            command: run-shell ~/.config/tmux/plugins/tmux-logging/scripts/screen_capture.sh
          - name: Clear history
            key: x
            command: run-shell ~/.config/tmux/plugins/tmux-logging/scripts/clear_history.sh
      - separator: true
      - name: Yank line
        key: y
        command: run-shell -b ~/.config/tmux/plugins/tmux-yank/scripts/copy_line.sh
      - name: Yank PWD
        key: Y
        command: run-shell -b ~/.config/tmux/plugins/tmux-yank/scripts/copy_pane_pwd.sh
  - separator: true
  - name: +Overseer
    key: o
    menu:
      - name: User access (subscriptions + roles)
        key: p
        command: "display-popup -E -d \"#{pane_current_path}\" -w 90% -h 75% ~/.config/tmux/scripts/show-user-access.sh"
  - separator: true
  - name: tmux-menus
    key: M
    command: run-shell ~/.config/tmux/plugins/tmux-menus/items/main.sh
  - name: Time
    key: T
    command: clock-mode
  - name: Show messages
    key: "~"
    command: show-messages
  - name: +Keys
    key: "?"
    command: list-keys -N
