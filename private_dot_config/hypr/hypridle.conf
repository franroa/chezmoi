# Hypridle 
# Original config submitted by https://github.com/SherLock707                                                       
                                                      
$iDIR="$HOME/.config/swaync/images/ja.png"

general {
    # hyprlock does not emit the logind Unlock signal, so unlock_cmd is unreliable.
    # Instead: enable DND, run hyprlock in the foreground (it blocks until the
    # session is unlocked), then disable DND when it exits. pidof guard avoids
    # double-launch / double-toggle if a lock is already up.
    lock_cmd = pidof hyprlock || { /home/froa/.config/hypr/scripts/dnd-set.sh on ; hyprlock ; /home/froa/.config/hypr/scripts/dnd-set.sh off ; }
    unlock_cmd = /home/froa/.config/hypr/scripts/dnd-set.sh off # belt-and-suspenders if logind Unlock does fire
    before_sleep_cmd = sleep 0.3 && loginctl lock-session    # ensures that the session is locked before going to sleep
    after_sleep_cmd = sleep 1 && hyprctl dispatch dpms on && hyprctl reload # turn on screen after sleep
    ignore_dbus_inhibit = false             # whether to ignore dbus-sent idle-inhibit requests (used by e.g. firefox or steam)
}

