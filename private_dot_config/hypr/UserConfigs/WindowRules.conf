# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# For window rules and layerrules
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

# This file is used to add or overwrite window rules 
# This file will not be modified during dotfiles updates

# Workspace assignments (without silent = switch to workspace on window open)
windowrule = match:class ^(com\.mitchellh\.ghostty|ghostty)$, workspace 1
windowrule = match:class ^([Ff]irefox|org.mozilla.firefox|[Ff]irefox-esr|[Ff]irefox-bin)$, workspace 2
windowrule = match:class ^([Gg]oogle-chrome(-beta|-dev|-unstable)?)$, workspace 3
# Slack - normal window on workspace 4, suppress focus stealing
windowrule = match:class ^(Slack)$, workspace 4

windowrule = match:class ^([Tt]hunar|org.gnome.Nautilus|[Pp]cmanfm-qt)$, workspace 5

# Scratchpad tags
windowrule = match:class ^(scratchpad)$, tag +scratchpad_term
windowrule = match:class ^(btop-scratchpad)$, tag +scratchpad_btop
windowrule = match:class ^(files-scratchpad)$, tag +scratchpad_files
windowrule = match:class ^(org.pulseaudio.pavucontrol)$, tag +scratchpad_volume
windowrule = match:class ^(org.gnome.Calculator)$, tag +scratchpad_calc
windowrule = match:class ^(spotify)$, tag +scratchpad_music
windowrule = match:class ^(org.keepassxc.KeePassXC)$, tag +scratchpad_keepass

# Scratchpad term - cyan accent
windowrule {
    name = scratchpad-term
    match:class = ^(scratchpad)$
    float = on
    opacity = 1.0 1.0
}

# Scratchpad btop - purple accent
windowrule {
    name = scratchpad-btop
    match:class = ^(btop-scratchpad)$
    float = on
    opacity = 0.90 0.85
}

# Scratchpad files - blue accent
windowrule {
    name = scratchpad-files
    match:class = ^(files-scratchpad)$
    float = on
    opacity = 0.95 0.90
}

# Scratchpad volume - yellow accent
windowrule {
    name = scratchpad-volume
    match:class = ^(org.pulseaudio.pavucontrol)$
    float = on
    center = on
    opacity = 0.92 0.88
}

# Scratchpad music (spotify) - green accent
windowrule {
    name = scratchpad-music
    match:class = ^(spotify)$
    float = on
    opacity = 1.0 0.95
    no_blur = on
}

# Scratchpad calculator - green accent
windowrule {
    name = scratchpad-calc
    match:class = ^(org.gnome.Calculator)$
    float = on
    center = on
    opacity = 0.92 0.88
    size = (monitor_w*0.25) (monitor_h*0.35)
}

# Scratchpad keepassxc - red accent
windowrule {
    name = scratchpad-keepass
    match:class = ^(org.keepassxc.KeePassXC)$
    float = on
    opacity = 0.95 0.90
}

# OpenCode Chezmoi
windowrule {
    name = opencode-chezmoi
    match:class = ^(opencode-chezmoi)$
    float = on
    opacity = 0.95 0.90
    size = (monitor_w*0.80) (monitor_h*0.80)
}

# OpenCode Hypr - orange accent
windowrule {
    name = opencode-hypr
    match:class = ^(opencode-hypr)$
    float = on
    opacity = 0.95 0.90
    size = (monitor_w*0.80) (monitor_h*0.80)
}

# OpenCode Nvim - magenta accent
windowrule {
    name = opencode-nvim
    match:class = ^(opencode-nvim)$
    float = on
    opacity = 0.95 0.90
    size = (monitor_w*0.80) (monitor_h*0.80)
}

# OpenCode CWD - cyan accent
windowrule {
    name = opencode-cwd
    match:class = ^(opencode-cwd)$
    float = on
    opacity = 0.95 0.90
    size = (monitor_w*0.80) (monitor_h*0.80)
}

# Agent of Empires CWD
windowrule {
    name = aoe-cwd
    match:class = ^(aoe-cwd)$
    float = on
    opacity = 0.95 0.90
    size = (monitor_w*0.80) (monitor_h*0.80)
}

# OpenCode ReadItLater
windowrule {
    name = opencode-readitlater
    match:class = ^(opencode-readitlater)$
    float = on
    opacity = 0.95 0.90
    size = (monitor_w*0.80) (monitor_h*0.80)
}

# KOReader scratchpad - book aspect ratio, centered
windowrule {
    name = koreader
    match:class = ^(KOReader)$
    float = on
    size = (monitor_w*0.45) (monitor_h*0.90)
    center = on
}

# KOReader dev scratchpad windows - force tiling
windowrule = match:class ^(opencode-koreader)$, float = off
windowrule = match:class ^(KOReader)$, match:workspace special:koreader_dev, float = off
