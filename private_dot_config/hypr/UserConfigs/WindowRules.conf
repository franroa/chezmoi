# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# For window rules and layerrules
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

# This file is used to add or overwrite window rules 
# This file will not be modified during dotfiles updates

# Scratchpad tags
windowrule = match:class ^(scratchpad)$, tag +scratchpad_term
windowrule = match:class ^(btop-scratchpad)$, tag +scratchpad_btop
windowrule = match:class ^(files-scratchpad)$, tag +scratchpad_files
windowrule = match:class ^(org.pulseaudio.pavucontrol)$, tag +scratchpad_volume
windowrule = match:class ^(org.gnome.Calculator)$, tag +scratchpad_calc
windowrule = match:class ^(spotify)$, tag +scratchpad_music
windowrule = match:class ^(org.keepassxc.KeePassXC)$, tag +scratchpad_keepass

# Scratchpad term - cyan accent
windowrule {
    name = scratchpad-term
    match:class = ^(scratchpad)$
    float = on
    opacity = 1.0 1.0
}

# Scratchpad btop - purple accent
windowrule {
    name = scratchpad-btop
    match:class = ^(btop-scratchpad)$
    float = on
    opacity = 0.90 0.85
}

# Scratchpad files - blue accent
windowrule {
    name = scratchpad-files
    match:class = ^(files-scratchpad)$
    float = on
    opacity = 0.95 0.90
}

# Scratchpad volume - yellow accent
windowrule {
    name = scratchpad-volume
    match:class = ^(org.pulseaudio.pavucontrol)$
    float = on
    center = on
    opacity = 0.92 0.88
}

# Scratchpad music (spotify) - green accent
windowrule {
    name = scratchpad-music
    match:class = ^(spotify)$
    float = on
    opacity = 1.0 0.95
    no_blur = on
}

# Scratchpad calculator - green accent
windowrule {
    name = scratchpad-calc
    match:class = ^(org.gnome.Calculator)$
    float = on
    center = on
    opacity = 0.92 0.88
    size = (monitor_w*0.25) (monitor_h*0.35)
}

# Scratchpad keepassxc - red accent
windowrule {
    name = scratchpad-keepass
    match:class = ^(org.keepassxc.KeePassXC)$
    float = on
    opacity = 0.95 0.90
}

# OpenCode Hypr - orange accent
windowrule {
    name = opencode-hypr
    match:class = ^(opencode-hypr)$
    float = on
    opacity = 0.95 0.90
    size = (monitor_w*0.80) (monitor_h*0.80)
}

# OpenCode Nvim - magenta accent
windowrule {
    name = opencode-nvim
    match:class = ^(opencode-nvim)$
    float = on
    opacity = 0.95 0.90
    size = (monitor_w*0.80) (monitor_h*0.80)
}

# OpenCode CWD - cyan accent
windowrule {
    name = opencode-cwd
    match:class = ^(opencode-cwd)$
    float = on
    opacity = 0.95 0.90
    size = (monitor_w*0.80) (monitor_h*0.80)
}
