# Decoration Settings

# Hyprland Wiki Links
# Animation - https://wiki.hyprland.org/Configuring/Animations/
# Decoration - https://wiki.hyprland.org/Configuring/Variables/#decoration

# Sourcing colors generated by wallust
source = $HOME/.config/hypr/wallust/wallust-hyprland.conf

general {
  border_size = 2
  gaps_in = 4
  gaps_out = 8

  col.active_border = $color15 $color5 45deg
  col.inactive_border = $color0
}

decoration {
  rounding = 14
  
  active_opacity = 1.0
  inactive_opacity = 0.92
  fullscreen_opacity = 1.0

  dim_inactive = true
  dim_strength = 0.08
  dim_special = 0.5

  shadow {
    enabled = true
    range = 12
    render_power = 3
    offset = 0 4
    scale = 1.0

    color = rgba(0, 0, 0, 0.55)
    color_inactive = rgba(0, 0, 0, 0.35)
  }

  blur {
    enabled = true
    size = 6
    passes = 2
    new_optimizations = true
    xray = false
    ignore_opacity = true
    special = true
    popups = true
    noise = 0.02
    contrast = 1.0
    brightness = 1.0
    vibrancy = 0.2
    vibrancy_darkness = 0.2
  }
}

group {
  col.border_active = $color15

	groupbar {
		col.active = $color0
  }
}
