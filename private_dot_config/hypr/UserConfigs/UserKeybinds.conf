bindd = $mainMod, 0, go to Slack and show unreads, exec, ~/.config/hypr/scripts/goto-slack.sh

# Morning digest scratchpad (last digest + today's Google Calendar agenda).
# Overrides the default Alt+4 (KOReader) from configs/Keybinds.conf.
unbind = ALT, 4
bindd = ALT, 4, Morning digest scratchpad, exec, ~/.config/hypr/scripts/toggle-digest.sh

unbind = $mainMod, SPACE
bindd = $mainMod, SPACE, open wlr-which-key, exec, /home/froa/.cargo/bin/wlr-which-key

unbind = $mainMod SHIFT, C
bindd = $mainMod SHIFT, C, reload hyprland and hyprpanel, exec, hyprctl reload; ~/.config/hypr/scripts/HyprpanelWallust.sh; pypr reload

# Hide floating window to workspace 99 (only if focused window is floating)
bindd = $mainMod SHIFT, H, hide floating window to workspace 99, exec, hyprctl activewindow -j | jq -e '.floating' && hyprctl dispatch movetoworkspacesilent 99
# Bring back all windows from workspace 99 to current workspace
bindd = $mainMod CTRL, H, restore hidden windows, exec, hyprctl clients -j | jq -r '.[] | select(.workspace.id == 99) | .address' | xargs -I{} hyprctl dispatch movetoworkspacesilent e+0,address:{}
