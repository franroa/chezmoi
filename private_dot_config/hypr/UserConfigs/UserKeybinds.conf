# Quick Win 1: Rofi Calculator (SUPER + =)
bindd = $mainMod, equal, calculator, exec, $scriptsDir/RofiCalc.sh

# Quick Win 3: Regenerate wallust colors (SUPER + SHIFT + T)
bindd = $mainMod SHIFT, T, regenerate colors, exec, $scriptsDir/WallustRegenerate.sh

# Focus Mode (SUPER + F) - toggles DND
bindd = $mainMod, F, toggle focus mode, exec, $scriptsDir/FocusMode.sh

# Toggle HyprPanel visibility (SUPER + SHIFT + B)
bindd = $mainMod SHIFT, B, toggle panel, exec, astal -i hyprpanel -t bar-0
