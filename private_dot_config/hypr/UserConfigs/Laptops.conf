# See https://wiki.hyprland.org/Configuring/Keywords/ for more variable settings
# These configs are mostly for laptops. This is addemdum to Keybinds.conf

$mainMod = SUPER
$scriptsDir = $HOME/.config/hypr/scripts
$UserConfigs = $HOME/.config/hypr/UserConfigs

# Lid switch (2026-07-07): no lock on close (user request; logind also ignores the lid, so no
# suspend either). Blank the panel via BACKLIGHT, never DPMS: eDP-1 is the Intel GPU's only
# output since NVIDIA became primary renderer, so dpms-off makes aquamarine deinit the Intel
# secondary renderer and the panel comes back permanently frozen (only relogin recovers —
# reload, damage-tracking nudges, and full disable/re-enable all failed). Backlight-off looks
# the same but touches no DRM state. -s saves the level, -r restores it; the fallback kicks
# in if a duplicate close event saved 0.
bindl = , switch:on:Lid Switch, exec, brightnessctl -d intel_backlight -s set 0
bindl = , switch:off:Lid Switch, exec, sh -c 'brightnessctl -d intel_backlight -r; [ "$(brightnessctl -d intel_backlight g)" -eq 0 ] && brightnessctl -d intel_backlight set 60%'
