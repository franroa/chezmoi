exec-once = sleep 2 && hyprpm reload

# Enable Game Mode on startup (disables animations/blur/shadows/gaps, switches eDP-1 to 240Hz).
# Waits for the compositor; default state has animations on, so this toggles into game mode once.
exec-once = bash -c 'until hyprctl getoption animations:enabled &>/dev/null; do sleep 0.5; done; sleep 1; ~/.config/hypr/scripts/GameMode.sh'
# exec-once = sleep 3 && foot --app-id=aoe-cwd fish -c 'tmux'
# exec-once = foot --app-id=aoe-cwd fish -c 'tmux new-session -A -s froa'
exec-once = wl-clip-persist --clipboard both
exec-once = wlr-which-key
exec-once = ~/.config/hyprpanel/scripts/battery-alert.sh
exec-once = ~/.config/hyprpanel/scripts/battery-blink.sh
exec-once = bash -c 'until hyprctl version &>/dev/null; do sleep 0.5; done; rm -f /run/user/1001/hypr/*/.pyprland.sock 2>/dev/null; sleep 0.5; /home/froa/.local/bin/pypr'
exec-once = [workspace 4 silent] ~/.config/hypr/scripts/slack-wrapper.sh
exec-once = [workspace 5 silent] 1password
exec-once = ~/.config/hypr/scripts/slack-monitor.sh monitor
exec-once = ~/.config/hypr/scripts/gitlab-monitor.sh monitor
exec-once = ~/.config/hypr/scripts/jira-monitor.sh monitor
