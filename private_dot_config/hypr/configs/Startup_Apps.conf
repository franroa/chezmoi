# Commands and Apps to be executed at launch (vendor defaults)
$scriptsDir = $HOME/.config/hypr/scripts
$UserScripts = $HOME/.config/hypr/UserScripts
$lock = $scriptsDir/LockScreen.sh
$SwwwRandom = $UserScripts/WallpaperAutoChange.sh
$livewallpaper=""
$wallDIR = $HOME/Pictures/wallpapers  # change path manually here if needed

### wallpaper stuff ###
exec-once = swww-daemon --format xrgb
exec-once = sleep 1 && swww img $HOME/.config/hypr/wallpaper_effects/.wallpaper_current
#exec-once = mpvpaper '*' -o "load-scripts=no no-audio --loop" $livewallpaper
# wallpaper random
#exec-once = $SwwwRandom $wallDIR # random wallpaper switcher every 30 minutes

### Startup ###
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = $HOME/.config/hypr/scripts/Dropterminal.sh kitty &
exec-once = $scriptsDir/Polkit.sh
exec-once = nm-applet --indicator
exec-once = nm-tray   # For ubuntu
#exec-once = swaync  # Disabled - using hyprpanel notifications
#exec-once = ags
#exec-once = blueman-applet
#exec-once = rog-control-center
# exec-once = waybar  # Disabled - using hyprpanel instead
exec-once = ~/.config/hypr/scripts/HyprpanelWallust.sh  # starts hyprpanel with @charset fix
exec-once = ~/.config/hypr/scripts/notif-panel-event.sh  # notification panel event listener
exec-once = ~/.config/hypr/scripts/notif-monitor.sh monitor  # unified notification monitor (Slack + OpenCode)
# exec-once = python3 ~/.config/hypr/scripts/notif_listener.py  # track Slack notifications with letters
exec-once = qs -c overview  # Quickshell Overview
exec-once = hypridle
#exec-once = $scriptsDir/Hyprsunset.sh auto
exec-once = dbus-update-activation-environment --systemd HYPRLAND_INSTANCE_SIGNATURE
# Clipboard manager
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Rainbow borders (disabled by default; use quick settings menu)
#exec-once = $UserScripts/RainbowBorders.sh


# Here are list of features available but disabled by default
# Persistent wallpaper
# exec-once = swww-daemon --format xrgb && swww img $wallDIR/mecha-nostalgia.png

# Gnome polkit for NixOS
#exec-once = $scriptsDir/Polkit-NixOS.sh

# xdg-desktop-portal-hyprland (should be auto starting. However, you can force to start)
#exec-once = $scriptsDir/PortalHyprland.sh
# Removed duplicate entries - blueman-applet, ags, qs already started above
#
# We keep the sleep to ensure the display backend is ready
exec-once = /home/froa/.local/bin/hyprshade auto
