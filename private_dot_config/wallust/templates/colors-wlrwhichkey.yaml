# wlr-which-key colors - generated by wallust
# Leader: Super+Space

font: JetBrainsMono Nerd Font 13
background: "#{{background | strip}}e0"
color: "#{{foreground | strip}}"
border: "#{{color12 | strip}}"
separator: " 󰁔 "
border_width: 2
corner_r: 10
padding: 24
rows_per_column: 10
column_padding: 40

anchor: bottom-right
margin_right: 20
margin_bottom: 20

# Critical: allows wlr-which-key to intercept compositor keybindings
inhibit_compositor_keyboard_shortcuts: true
menu:
  # Quick Actions
  - key: "space"
    desc: "󰈞 Find Files"
    cmd: wofi --show drun --style ~/.config/wofi/active-theme.css

  - key: "comma"
    desc: "󰈙 Buffers"
    cmd: ~/.config/sway/window-switcher.sh

  - key: "period"
    desc: "󰓩 Scratch Buffer"
    cmd: hyprctl dispatch togglespecialworkspace scratchpad

  - key: "slash"
    desc: "󰈞 Grep"
    cmd: bash -c 'wofi --show run --style ~/.config/wofi/active-theme.css'

  - key: "grave"
    desc: "󰆍 Terminal (pypr)"
    cmd: pypr toggle term

  - key: "question"
    desc: "󰌌 Cheatsheet"
    cmd: ~/.config/sway/cheatsheet.sh

  # +audio (v)
  - key: "v"
    desc: "󰕾 +audio"
    submenu:
      - key: "v"
        desc: "󰕾 Sound Settings"
        cmd: env XDG_CURRENT_DESKTOP=GNOME gnome-control-center sound
      - key: "m"
        desc: "󰝟 Mute Toggle"
        cmd: pactl set-sink-mute @DEFAULT_SINK@ toggle
      - key: "equal"
        desc: "󰝝 Volume +5%"
        cmd: pactl set-sink-volume @DEFAULT_SINK@ +5%
      - key: "minus"
        desc: "󰝞 Volume -5%"
        cmd: pactl set-sink-volume @DEFAULT_SINK@ -5%
      - key: "0"
        desc: "󰝟 Volume 0%"
        cmd: pactl set-sink-volume @DEFAULT_SINK@ 0%
      - key: "5"
        desc: "󰕾 Volume 50%"
        cmd: pactl set-sink-volume @DEFAULT_SINK@ 50%
      - key: "1"
        desc: "󰕾 Volume 100%"
        cmd: pactl set-sink-volume @DEFAULT_SINK@ 100%

  # +brightness (V)
  - key: "V"
    desc: "󰃟 +brightness"
    submenu:
      - key: "equal"
        desc: "󰃟 Brightness +10%"
        cmd: brightnessctl set +10%
      - key: "minus"
        desc: "󰃞 Brightness -10%"
        cmd: brightnessctl set 10%-
      - key: "5"
        desc: "󰃜 Brightness 50%"
        cmd: brightnessctl set 50%
      - key: "0"
        desc: "󰃟 Brightness 100%"
        cmd: brightnessctl set 100%

  # +media (m)
  - key: "m"
    desc: "󰎈 +media"
    submenu:
      - key: "m"
        desc: "󰐎 Play/Pause"
        cmd: playerctl play-pause
      - key: "n"
        desc: "󰒭 Next"
        cmd: playerctl next
      - key: "p"
        desc: "󰒮 Previous"
        cmd: playerctl previous
      - key: "s"
        desc: "󰓛 Stop"
        cmd: playerctl stop

  # +info (i)
  - key: "i"
    desc: "󰋽 +info"
    submenu:
      - key: "i"
        desc: "󰩟 IP Address"
        cmd: bash -c 'ip=$(curl -s ifconfig.me); notify-send "Public IP" "$ip"; echo "$ip" | wl-copy'
      - key: "l"
        desc: "󰩟 Local IP"
        cmd: bash -c 'ip=$(hostname -I | awk "{print \$1}"); notify-send "Local IP" "$ip"; echo "$ip" | wl-copy'
      - key: "b"
        desc: "󰁹 Battery"
        cmd: bash -c 'bat=$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null || echo "N/A"); notify-send "Battery" "${bat}%"'
      - key: "w"
        desc: "󰖐 Weather"
        cmd: bash -c 'notify-send "Weather" "$(curl -s wttr.in/?format=%l:+%c+%t+%h)"'
      - key: "t"
        desc: "󰔏 Temperature"
        cmd: ~/.config/hypr/scripts/show-temperature.sh
      - key: "T"
        desc: "󱃃 Set Idle Temp"
        cmd: ~/.config/hypr/scripts/set-idle-temp.sh

  # +layout (l)
  - key: "l"
    desc: "󰕰 +layout"
    submenu:
      - key: "c"
        desc: "󰆧 Center Float"
        cmd: bash -c 'hyprctl dispatch togglefloating; hyprctl dispatch centerwindow'
      - key: "C"
        desc: "󰆧 Layout Center (pypr)"
        cmd: ~/.local/bin/pypr layout_center toggle
      - key: "p"
        desc: "󰹑 PiP Bottom-Right"
        cmd: bash -c 'hyprctl dispatch togglefloating; hyprctl dispatch pin; hyprctl dispatch resizeactive exact 480 270; hyprctl dispatch moveactive exact 1420 790'
      - key: "t"
        desc: "󰕮 Tabbed"
        cmd: hyprctl dispatch togglegroup
      - key: "f"
        desc: "󰊓 Fullscreen"
        cmd: hyprctl dispatch fullscreen
      - key: "z"
        desc: "󰍉 Zoom In (pypr)"
        cmd: ~/.local/bin/pypr zoom ++0.5
      - key: "Z"
        desc: "󰍉 Zoom Reset (pypr)"
        cmd: ~/.local/bin/pypr zoom
      - key: "s"
        desc: "󰁁 Shift Monitor Right (pypr)"
        cmd: ~/.local/bin/pypr shift_monitors +1
      - key: "S"
        desc: "󰁂 Shift Monitor Left (pypr)"
        cmd: ~/.local/bin/pypr shift_monitors -1

  # +quick (;)
  - key: "semicolon"
    desc: "󱓞 +quick"
    submenu:
      - key: "c"
        desc: "󰆒 Color Picker"
        cmd: bash -c 'color=$(grim -g "$(slurp -p)" -t ppm - | convert - -format "%[hex:p{0,0}]" info:-); notify-send "Color" "#$color"; echo "#$color" | wl-copy'
      - key: "m"
        desc: "󰃬 Math/Calc"
        cmd: bash -c 'result=$(wofi --dmenu --style ~/.config/wofi/active-theme.css -p "Calc" | bc -l 2>/dev/null); [ -n "$result" ] && notify-send "Result" "$result" && echo "$result" | wl-copy'
      - key: "n"
        desc: "󰎞 Quick Note"
        cmd: bash -c 'note=$(wofi --dmenu --style ~/.config/wofi/active-theme.css -p "Quick Note"); [ -n "$note" ] && echo "$(date +%Y-%m-%d\ %H:%M) - $note" >> ~/notes.txt && notify-send "Note Saved" "$note"'
      - key: "u"
        desc: "󰌷 UUID"
        cmd: bash -c 'uuid=$(uuidgen); echo "$uuid" | wl-copy; notify-send "UUID" "$uuid"'
      - key: "p"
        desc: "󰌆 Password Gen"
        cmd: bash -c 'pw=$(openssl rand -base64 16); echo "$pw" | wl-copy; notify-send "Password" "Copied to clipboard"'
      - key: "d"
        desc: "󰃭 Date/Time"
        cmd: bash -c 'dt=$(date "+%Y-%m-%d %H:%M:%S"); echo "$dt" | wl-copy; notify-send "Date/Time" "$dt"'

  # +apps (a)
  - key: "a"
    desc: "󰣆 +apps"
    submenu:
      - key: "f"
        desc: "󰈹 Firefox"
        cmd: firefox
      - key: "c"
        desc: "󰊯 Chrome"
        cmd: google-chrome
      - key: "s"
        desc: "󰒱 Slack"
        cmd: ~/.config/hypr/scripts/goto-slack.sh
      - key: "n"
        desc: "󰈄 Notion"
        cmd: notion-snap-reborn
      - key: "m"
        desc: "󰓇 Spotify"
        cmd: spotify
      - key: "b"
        desc: "󰌋 Bitwarden"
        cmd: ~/.config/sway/secrets-wofi.sh
      - key: "e"
        desc: "󰉋 Nautilus"
        cmd: nautilus
      - key: "g"
        desc: "󰚩 ChatGPT"
        cmd: firefox --new-tab "https://chat.openai.com"
      - key: "C"
        desc: "󰚩 Claude"
        cmd: firefox --new-tab "https://claude.ai"
      - key: "j"
        desc: "󰌃 Jira"
        cmd: ~/.config/sway/jira-notifications.sh
      - key: "l"
        desc: "󰊢 GitLab MRs"
        cmd: ~/.config/sway/gitlab-notifications.sh
      - key: "M"
        desc: "󰃭 Today's Meetings"
        cmd: ~/.config/sway/calendar-float.sh

  # +capture (c)
  - key: "c"
    desc: "󰹑 +capture"
    submenu:
      - key: "c"
        desc: "󰹑 Screenshot Area"
        cmd: bash -c 'grimshot save area - | swappy -f -'
      - key: "w"
        desc: "󰖯 Screenshot Window"
        cmd: bash -c 'grimshot save window - | swappy -f -'
      - key: "s"
        desc: "󰍹 Screenshot Screen"
        cmd: bash -c 'grimshot save output - | swappy -f -'
      - key: "r"
        desc: "󰻃 Record Toggle"
        cmd: bash -c 'if pgrep wf-recorder > /dev/null; then killall -s SIGINT wf-recorder && notify-send "Recording" "Stopped"; else wf-recorder -g "$(slurp)" -f ~/Videos/recording-$(date +%Y%m%d_%H%M%S).mp4 & notify-send "Recording" "Started"; fi'

  # +docker (d)
  - key: "d"
    desc: "󰡨 +docker"
    submenu:
      - key: "d"
        desc: "󰡨 Docker PS"
        cmd: wezterm -e bash -c 'docker ps -a; read -p "Press Enter..."'
      - key: "l"
        desc: "󰌱 Docker Logs"
        cmd: bash -c 'container=$(docker ps | tail -n +2 | awk "{print \$NF}" | rofi -dmenu -p "Container"); [ -n "$container" ] && wezterm -e docker logs -f "$container"'
      - key: "s"
        desc: "󰓦 Docker Stats"
        cmd: wezterm -e docker stats
      - key: "e"
        desc: "󰆍 Exec Shell"
        cmd: bash -c 'container=$(docker ps | tail -n +2 | awk "{print \$NF}" | rofi -dmenu -p "Container"); [ -n "$container" ] && wezterm -e docker exec -it "$container" sh'

  # +file (f)
  - key: "f"
    desc: "󰈙 +file"
    submenu:
      - key: "f"
        desc: "󰈞 Find Files"
        cmd: wofi --show drun --style ~/.config/wofi/active-theme.css
      - key: "r"
        desc: "󰋚 Recent Files"
        cmd: bash -c 'find ~ -type f -mtime -7 2>/dev/null | head -500 | wofi --dmenu --style ~/.config/wofi/active-theme.css -p "Recent" | xargs -r wezterm -e nvim'
      - key: "e"
        desc: "󰉋 Explorer"
        cmd: nautilus
      - key: "t"
        desc: "󰆍 Terminal"
        cmd: wezterm
      - key: "c"
        desc: "󰒓 Config Files"
        cmd: bash -c 'find ~/.config -type f | wofi --dmenu --style ~/.config/wofi/active-theme.css -p "Config" | xargs wezterm -e nvim'

  # +git (g)
  - key: "g"
    desc: "󰊢 +git"
    submenu:
      - key: "g"
        desc: "󰊢 LazyGit"
        cmd: wezterm -e lazygit
      - key: "s"
        desc: "󰋜 Git Status"
        cmd: wezterm -e lazygit status
      - key: "l"
        desc: "󰋚 Git Log"
        cmd: wezterm -e lazygit log
      - key: "f"
        desc: "󰉋 Open GitLab"
        cmd: firefox --new-tab "https://gitlab.com"

  # +notifications (n)
  - key: "n"
    desc: "󰂚 +notifications"
    submenu:
      - key: "n"
        desc: "󰂚 Toggle Panel"
        cmd: swaync-client -t -sw
      - key: "s"
        desc: "󰒱 Open Latest Slack"
        cmd: ~/.config/hypr/scripts/invoke-notification.sh
      - key: "O"
        desc: "󰈄 OpenCode"
        cmd: ~/.config/hypr/scripts/goto-latest-opencode-notification.sh
      - key: "o"
        desc: "󰂞 Open Latest"
        cmd: ~/.config/hypr/scripts/invoke-notification.sh
      - key: "g"
        desc: "󰒱 Go to Slack"
        cmd: ~/.config/hypr/scripts/goto-slack.sh
      - key: "c"
        desc: "󰅖 Close Latest"
        cmd: swaync-client -C
      - key: "C"
        desc: "󰅗 Close All"
        cmd: swaync-client -C
      - key: "d"
        desc: "󰍶 Toggle DND"
        cmd: ~/.config/hypr/scripts/DndMode.sh
      - key: "h"
        desc: "󰋚 Show History"
        cmd: swaync-client -t -sw
      - key: "r"
        desc: "󰑓 Reload Config"
        cmd: swaync-client -R && swaync-client -rs

  # +overseer (o) - Automation scripts
  - key: "o"
    desc: "󱁤 +overseer"
    submenu:
      - key: "a"
        desc: "󰠅 Azure PIM Elevate"
        cmd: foot -e ~/.config/sway/elevate-azure-pim.sh
      - key: "s"
        desc: "🟢 sandbox"
        cmd: pypr toggle k9s_sandbox
      - key: "S"
        desc: "󰓦 Syncthing"
        cmd: syncthing
      - key: "T"
        desc: "󰍁 Touchpad Toggle"
        cmd: ~/.config/hyprpanel/scripts/touchpad-toggle.sh toggle
      - key: "p"
        desc: "󱃾 +platform-live"
        submenu:
          - key: "e"
            desc: "🇪🇺 platform EU"
            cmd: pypr toggle k9s_platform_eu01
          - key: "u"
            desc: "🇺🇸 platform US"
            cmd: pypr toggle k9s_platform_us01
          - key: "c"
            desc: "🇨🇦 platform CA"
            cmd: pypr toggle k9s_platform_ca01
      - key: "t"
        desc: "󱃾 +technosylva-live"
        submenu:
          - key: "e"
            desc: "🇪🇺 technosylva EU"
            cmd: pypr toggle k9s_technosylva_eu01
          - key: "u"
            desc: "🇺🇸 technosylva US"
            cmd: pypr toggle k9s_technosylva_us01
          - key: "c"
            desc: "🇨🇦 technosylva CA"
            cmd: pypr toggle k9s_technosylva_ca01

  # +connections (O)
  - key: "O"
    desc: "󰖩 +connect"
    submenu:
      - key: "w"
        desc: "󰖩 WiFi"
        cmd: ~/.config/sway/wifi-wofi.sh
      - key: "b"
        desc: "󰂯 Bluetooth"
        cmd: ~/.config/sway/bluetooth-wofi.sh
      - key: "s"
        desc: "󰢹 SSH"
        cmd: ~/.config/sway/ssh-wofi.sh
      - key: "v"
        desc: "󰖂 VPN"
        cmd: ~/.config/waybar/scripts/vpn-toggle.sh
      - key: "n"
        desc: "󰛳 Network Settings"
        cmd: env XDG_CURRENT_DESKTOP=GNOME gnome-control-center network

  # +pomodoro (P)
  - key: "P"
    desc: "󰔟 +pomodoro"
    submenu:
      - key: "p"
        desc: "󰐊 Toggle"
        cmd: ~/.config/hyprpanel/scripts/pomodoro.sh toggle
      - key: "s"
        desc: "󰓛 Skip"
        cmd: ~/.config/hyprpanel/scripts/pomodoro.sh skip
      - key: "r"
        desc: "󰜉 Reset"
        cmd: ~/.config/hyprpanel/scripts/pomodoro.sh reset
      - key: "c"
        desc: "󰒓 Configure"
        cmd: ~/.config/hyprpanel/scripts/pomodoro.sh config

  # +pyprland (y) - Scratchpads & Plugins
  - key: "y"
    desc: "󱂬 +pyprland"
    submenu:
      # Scratchpad Management
      - key: "y"
        desc: "󰋜 List Scratchpads"
        cmd: ~/.config/hypr/scripts/scratchpad-list.sh
      - key: "H"
        desc: "󰘓 Hide All Scratchpads"
        cmd: ~/.local/bin/pypr hide "*"
      - key: "C"
        desc: "󰅖 Close All Scratchpads"
        cmd: bash -c 'hyprctl clients -j | jq -r ".[] | select(.workspace.name | startswith(\"special:\")) | .address" | xargs -I{} hyprctl dispatch closewindow address:{}'
      # Scratchpads
      - key: "t"
        desc: "󰆍 Terminal"
        cmd: pypr toggle term
      - key: "f"
        desc: "󰉋 Files"
        cmd: pypr toggle files
      - key: "b"
        desc: "󰄛 Btop"
        cmd: pypr toggle btop
      - key: "v"
        desc: "󰕾 Volume"
        cmd: pypr toggle volume
      - key: "m"
        desc: "󰓇 Music"
        cmd: pypr toggle music
      - key: "c"
        desc: "󰃬 Calculator"
        cmd: pypr toggle calc
      - key: "k"
        desc: "󰌆 KeePassXC"
        cmd: pypr toggle keepassxc
      # Plugins
      - key: "e"
        desc: "󱇙 Expose"
        cmd: ~/.local/bin/pypr expose
      - key: "z"
        desc: "󰍉 Magnify"
        cmd: ~/.local/bin/pypr zoom ++0.5
      - key: "Z"
        desc: "󰍉 Reset Zoom"
        cmd: ~/.local/bin/pypr zoom
      - key: "w"
        desc: "󰌧 Fetch Window"
        cmd: ~/.local/bin/pypr fetch_client_menu
      - key: "s"
        desc: "󰁁 Shift Monitors →"
        cmd: ~/.local/bin/pypr shift_monitors +1
      - key: "S"
        desc: "󰁂 Shift Monitors ←"
        cmd: ~/.local/bin/pypr shift_monitors -1
      - key: "d"
        desc: "󰍹 Toggle DPMS"
        cmd: ~/.local/bin/pypr toggle_dpms
      - key: "x"
        desc: "󰘓 Stash Window"
        cmd: ~/.local/bin/pypr toggle_special stash
      - key: "slash"
        desc: "󰍜 Shortcuts Menu"
        cmd: ~/.local/bin/pypr menu
      - key: "l"
        desc: "󰆧 Layout Center"
        cmd: ~/.local/bin/pypr layout_center toggle
      - key: "L"
        desc: "󰁌 Find Lost Windows"
        cmd: ~/.local/bin/pypr attract_lost

  # +quit/session (q)
  - key: "q"
    desc: "󰗼 +quit/session"
    submenu:
      - key: "q"
        desc: "󰗼 Quit Hyprland"
        cmd: hyprctl dispatch exit
      - key: "l"
        desc: "󰌾 Lock Screen"
        cmd: swaylock -f -c 000000
      - key: "s"
        desc: "󰤄 Suspend"
        cmd: systemctl suspend
      - key: "r"
        desc: "󰜉 Reboot"
        cmd: systemctl reboot
      - key: "p"
        desc: "󰐥 Power Off"
        cmd: systemctl poweroff

  # +terminal (t)
  - key: "t"
    desc: "󰆍 +terminal"
    submenu:
      - key: "t"
        desc: "󰆍 Terminal"
        cmd: wezterm
      - key: "g"
        desc: "󰊢 LazyGit"
        cmd: wezterm -e lazygit
      - key: "b"
        desc: "󰄛 Btop"
        cmd: wezterm -e btop
      - key: "n"
        desc: "󰎙 Node REPL"
        cmd: wezterm -e node
      - key: "p"
        desc: "󰌠 Python REPL"
        cmd: wezterm -e python3
      - key: "k"
        desc: "󱃾 K9s"
        cmd: wezterm -e k9s
      - key: "l"
        desc: "󰋚 System Logs"
        cmd: wezterm -e journalctl -f

  # +search (s)
  - key: "s"
    desc: "󰈞 +search"
    submenu:
      - key: "g"
        desc: "󰈞 Grep"
        cmd: bash -c 'wofi --show run --style ~/.config/wofi/active-theme.css'
      - key: "h"
        desc: "󰋖 Help Pages"
        cmd: bash -c 'man -k . | wofi --dmenu --style ~/.config/wofi/active-theme.css -p "Man" | awk "{print \$1}" | xargs man'
      - key: "k"
        desc: "󰌌 Keymaps"
        cmd: ~/.config/sway/cheatsheet.sh
      - key: "f"
        desc: "󰈞 Find Files"
        cmd: bash -c 'find ~ -type f 2>/dev/null | head -1000 | wofi --dmenu --style ~/.config/wofi/active-theme.css -p "Find" | xargs -r wezterm -e nvim'

  # +ui/toggle (u)
  - key: "u"
    desc: "󰙵 +ui/toggle"
    submenu:
      - key: "n"
        desc: "󰂛 Dismiss Notifications"
        cmd: hyprpanel toggleWindow notifications-window
      - key: "N"
        desc: "󰎟 Clear History"
        cmd: hyprpanel clearNotifications
      - key: "C"
        desc: "󰏘 Colorschemes"
        cmd: ~/.config/hypr/scripts/ThemeChanger.sh
      - key: "b"
        desc: "󰛨 Toggle Nightlight"
        cmd: ~/.config/hypr/scripts/Hyprsunset.sh toggle
      - key: "d"
        desc: "󰍶 Toggle DND"
        cmd: ~/.config/hypr/scripts/DndMode.sh
      - key: "g"
        desc: "󰓩 Toggle Gaps"
        cmd: bash -c 'hyprctl keyword general:gaps_in 0; hyprctl keyword general:gaps_out 0'
      - key: "G"
        desc: "󰓩 Restore Gaps"
        cmd: bash -c 'hyprctl keyword general:gaps_in 5; hyprctl keyword general:gaps_out 5'
      - key: "z"
        desc: "󰊓 Toggle Fullscreen"
        cmd: hyprctl dispatch fullscreen

  # +buffer (b)
  - key: "b"
    desc: "󰈙 +buffer"
    submenu:
      - key: "b"
        desc: "󰖯 Switch Buffer"
        cmd: hyprctl dispatch workspace previous
      - key: "d"
        desc: "󰅖 Close Window"
        cmd: hyprctl dispatch killactive
      - key: "p"
        desc: "󰐃 Toggle Pin"
        cmd: hyprctl dispatch pin
      - key: "f"
        desc: "󱂬 Toggle Floating"
        cmd: hyprctl dispatch togglefloating

  # +window (w)
  - key: "w"
    desc: "󰖯 +window"
    submenu:
      - key: "w"
        desc: "󰖯 Switch Window"
        cmd: ~/.config/sway/window-switcher.sh
      - key: "j"
        desc: "󰌕 Easymotion Jump"
        cmd: hyprctl dispatch easymotion action:hyprctl dispatch focuswindow address:{}
      - key: "o"
        desc: "󱇙 Overview (Hyprspace)"
        cmd: hyprctl dispatch overview:toggle
      - key: "d"
        desc: "󰅖 Close Window"
        cmd: hyprctl dispatch killactive
      - key: "m"
        desc: "󰊓 Fullscreen"
        cmd: hyprctl dispatch fullscreen
      - key: "h"
        desc: "󰁍 Focus Left"
        cmd: hyprctl dispatch movefocus l
      - key: "J"
        desc: "󰁅 Focus Down"
        cmd: hyprctl dispatch movefocus d
      - key: "k"
        desc: "󰁝 Focus Up"
        cmd: hyprctl dispatch movefocus u
      - key: "l"
        desc: "󰁔 Focus Right"
        cmd: hyprctl dispatch movefocus r
      - key: "e"
        desc: "󱇙 Expose (pypr)"
        cmd: ~/.local/bin/pypr expose
      - key: "f"
        desc: "󰌧 Fetch Window (pypr)"
        cmd: ~/.local/bin/pypr fetch_client_menu
      - key: "L"
        desc: "󰁌 Find Lost (pypr)"
        cmd: ~/.local/bin/pypr attract_lost

  # +diagnostics (x)
  - key: "x"
    desc: "󰒡 +diagnostics"
    submenu:
      - key: "x"
        desc: "󰒡 System Monitor"
        cmd: gnome-system-monitor
      - key: "b"
        desc: "󰄛 Btop"
        cmd: wezterm -e btop
      - key: "l"
        desc: "󰋚 System Logs"
        cmd: wezterm -e journalctl -f
      - key: "e"
        desc: "󰋚 Error Logs"
        cmd: wezterm -e journalctl -p err -b
      - key: "k"
        desc: "󱃾 K9s"
        cmd: wezterm -e k9s
      - key: "d"
        desc: "󰡨 Docker Stats"
        cmd: wezterm -e docker stats

  # +workspace (Tab)
  - key: "Tab"
    desc: "󰓩 +workspace"
    submenu:
      - key: "Tab"
        desc: "󰁔 New Workspace"
        cmd: hyprctl dispatch workspace empty
      - key: "l"
        desc: "󰁔 Last Workspace"
        cmd: hyprctl dispatch workspace previous
      - key: "n"
        desc: "󰒭 Next Workspace"
        cmd: hyprctl dispatch workspace e+1
      - key: "p"
        desc: "󰒮 Previous Workspace"
        cmd: hyprctl dispatch workspace e-1
      - key: "1"
        desc: "󰎤 Workspace 1"
        cmd: hyprctl dispatch workspace 1
      - key: "2"
        desc: "󰎧 Workspace 2"
        cmd: hyprctl dispatch workspace 2
      - key: "3"
        desc: "󰎪 Workspace 3"
        cmd: hyprctl dispatch workspace 3
      - key: "4"
        desc: "󰎭 Workspace 4"
        cmd: ~/.config/hypr/scripts/goto-slack.sh
      - key: "5"
        desc: "󰎱 Workspace 5"
        cmd: hyprctl dispatch workspace 5
      - key: "o"
        desc: "󱂬 Organize Windows"
        cmd: ~/.config/sway/organize-windows.sh

  - key: "r"
    desc: "󱂬 Organize Windows"
    cmd: ~/.config/sway/organize-windows.sh

  - key: "Escape"
    desc: "󰅖 Cancel"
    cmd: "true"
