# Global fallback config (used by GNOME and any desktop without its own
# <desktop>-portals.conf). Hyprland-specific routing lives in
# hyprland-portals.conf so it never leaks into a GNOME session.
[preferred]
default=gnome;gtk
org.freedesktop.impl.portal.ScreenCast=gnome
org.freedesktop.impl.portal.Screenshot=gnome
org.freedesktop.impl.portal.FileChooser=gtk
