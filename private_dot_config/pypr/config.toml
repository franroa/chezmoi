# Pyprland Configuration
# Documentation: https:/hyprland-community.github.io/pyprland/

[pyprland]
plugins = [
    "scratchpads",
    "expose",
    "magnify",
    "shift_monitors",
    "toggle_dpms",
    "toggle_special",
    "fetch_client_menu",
    "lost_windows",
    "layout_center",
    "shortcuts_menu",
]

[scratchpads.term]
animation = ""
command = "foot --app-id=foot-dropterm fish"
class = "foot-dropterm"
process_tracking = false
size = "85% 85%"
position = "7% 7%"
unfocus = "hide"
hypr_rules = ["float"]

[scratchpads.btop]
animation = ""
command = "foot --app-id=foot-btop fish -c btop"
class = "foot-btop"
process_tracking = false
size = "85% 85%"
