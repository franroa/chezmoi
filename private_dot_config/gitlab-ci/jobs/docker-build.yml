# Mini-job: Docker build. Injected when Dockerfile detected.
docker-build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build -t "${CI_REGISTRY_IMAGE:-app}:${CI_COMMIT_SHORT_SHA:-local}" .
  rules:
    - if: '$CI_COMMIT_BRANCH'
